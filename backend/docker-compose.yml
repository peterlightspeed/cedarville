services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      CORS_ORIGINS: http://localhost:5000,http://127.0.0.1:5000
    volumes:
      # Live-reload content edits without rebuilding the image.
      - ../site/data:/app/content:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
